    .corner-logo {
      position: absolute;
      top: 10px; left: 12px;
      width: 36px; height: auto;
      z-index: 2;
    }
    .layout {
      position: relative;
      z-index: 1;
      padding-left: 56px;  /* leave room for the corner logo */
      padding-top: 4px;
    }
    h2 {
      font-size: 14px;
      margin: 0 0 4px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.02em;
    }
    p.hint {
      font-size: 11px;
      color: var(--text);
      margin: 0 0 12px;
    }
    .drop {
      position: relative;
      z-index: 1;
      border: 2px dashed var(--accent);
      border-radius: 10px;
      padding: 28px 16px;
      text-align: center;
      cursor: pointer;
      transition: background 0.15s ease;
      font-size: 13px;
      color: var(--text);
      margin-top: 6px;
    }
    .drop:hover, .drop.over {
      background: rgba(255, 111, 32, 0.10);
    }
    .drop strong { color: var(--accent); }
    .status {
      position: relative; z-index: 1;
      margin-top: 12px;
      font-size: 12px;
      color: var(--text);
      min-height: 16px;
    }
    .status.err { color: #E5544A; }
    .mode {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      font-size: 11px;
      opacity: 0.85;
      cursor: pointer;
    }
    .mode input { accent-color: var(--accent); margin: 0; }
  </style>
</head>

  <div class="layout">
    <h2>Illustrator Layer Importer</h2>
    <p class="hint">Drop the <code>.figma.zip</code> from <code>extract_ai.py --zip</code>.</p>
    <div class="drop" id="drop">
      <div>Click or drag a <strong>.zip</strong> here</div>
    </div>
    <label class="mode"><input type="checkbox" id="vector" checked /> Import as editable vectors</label>
    <div class="status" id="status"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script>
    const drop = document.getElementById("drop");
    const status = document.getElementById("status");

    function setStatus(msg, isErr) {
      status.textContent = msg;
      status.classList.toggle("err", !!isErr);
    }

    drop.addEventListener("click", () => {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = ".zip";
      input.addEventListener("change", () => {
        if (input.files && input.files[0]) handleFile(input.files[0]);
      });
      input.click();
    });

    ["dragenter", "dragover"].forEach((ev) =>
      drop.addEventListener(ev, (e) => {
        e.preventDefault();
        drop.classList.add("over");
      })
    );
    ["dragleave", "drop"].forEach((ev) =>
      drop.addEventListener(ev, (e) => {
        e.preventDefault();
        drop.classList.remove("over");
      })
    );
    drop.addEventListener("drop", (e) => {
      const f = e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) handleFile(f);
    });

    async function handleFile(file) {
      if (!file.name.toLowerCase().endsWith(".zip")) {
        setStatus("Please choose a .zip file.", true);
        return;
      }
      setStatus("Reading " + file.name + "...");
      try {
        const zip = await JSZip.loadAsync(file);
        const manifestFile = zip.file("layers.json");
        if (!manifestFile) {
          setStatus("No layers.json found inside the zip.", true);
          return;
        }
        const manifest = JSON.parse(await manifestFile.async("text"));

        // Illustrator files carry artboards; fall back to the flat top-level
        // layer list so a PSD extractor zip still imports.
        const artboards = manifest.artboards && manifest.artboards.length
          ? manifest.artboards
          : [{
              index: 0,
              name: manifest.source || "Import",
              canvas: manifest.canvas,
              composite: manifest.composite,
              layers: manifest.layers || [],
            }];

        const wantVector = document.getElementById("vector").checked;

        // Vectors travel as text, rasters as bytes. Only load what we'll use,
        // but always load the raster as a fallback for a missing/failed SVG.
        const images = {};
        const svgs = {};
        let count = 0;
        for (const ab of artboards) {
          for (const layer of ab.layers || []) {
            count += 1;
            if (wantVector && layer.svg) {
              const sv = zip.file(layer.svg);
              if (sv) svgs[layer.svg] = await sv.async("text");
            }
            const entry = layer.file && zip.file(layer.file);
            if (entry) images[layer.file] = await entry.async("arraybuffer");
          }
        }

        setStatus("Importing " + count + " layer(s) across " + artboards.length + " artboard(s)...");
        parent.postMessage(
          { pluginMessage: { type: "import", manifest, artboards, images, svgs, wantVector } },
          "*"
        );
      } catch (err) {
        console.error(err);
        setStatus("Failed to parse zip: " + (err && err.message ? err.message : String(err)), true);
      }
    }
  </script>
</body>
</html>
